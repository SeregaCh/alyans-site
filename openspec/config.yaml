# Проектные конвенции — сайт ООО «Альянс».
# Форма файла продиктована устройством openspec 1.4.1: читаются только
# schema (строка), context (строка, идёт во все артефакты) и rules
# (списки по artifact-id: proposal, specs, design, tasks). Любые другие
# поля инструмент молча игнорирует — поэтому их здесь нет.
# Устройство проекта — PROJECT.md. Команды и классы риска — CLAUDE.md.
# Надпроектные конвенции — CONVENTIONS.md. Источник истины по UI — DESIGN.md.

schema: spec-driven

context: |
  Сайт-визитка ООО «Альянс» — подрядчика по трём равнозначным направлениям:
  инженерные сети; антикоррозионные и огнезащитные покрытия; монолитные работы.
  Шесть страниц, статика на Astro, Node 20, строгий TypeScript.

  Чего в проекте нет и не появляется без слова автора: базы данных, бэкенда,
  API, форм и любого приёма пользовательских данных, авторизации, аналитики,
  сторонних скриптов, внешних шрифтов, карт. Задача, которая требует чего-то
  из этого списка, — расхождение с ТЗ: остановка и вопрос, а не новый механизм.
  Клиентский JS допустим в одном месте — раскрытие мобильного меню.

  Содержание живёт в коллекциях контента, не в вёрстке: направления, объекты,
  допуски, документы, реквизиты. Поля — по ТЗ §8. Поля с исчерпывающим набором
  значений (направление объекта, тип допуска) описываются перечислением в схеме:
  опечатка валит сборку, а не доезжает до сайта. Открытые поля (наименование
  объекта, заказчик) — свободный текст.

  Копируемые значения — реестровые номера, ИНН, КПП, ОГРН, ОКПО, телефон,
  адрес почты — содержат только обычные символы: дефис U+002D и обычный пробел.
  Типографские замены (U+2011, U+00A0, тире внутри значения) запрещены и
  отвергаются схемой: значение копируют и вставляют в поиск государственного
  реестра, с подменённым символом запись не находится.

  Никогда не публикуются: банковские реквизиты, личные мобильные телефоны
  сотрудников, суммы договоров, карточка контрагента файлом.

  Машина общая с чужим живым проектом EasyPlan. Общие ресурсы — nginx, certbot,
  порты 80 и 443. На домене alyans-em.ru работает корпоративная почта: записи
  MX, SPF, DKIM, TXT не изменяются никогда, добавляются только A-записи.

rules:
  proposal:
    - 'Называй требование ТЗ и его критерий «готово»; рез без опоры на ТЗ или DESIGN не предлагается.'
    - 'Скажи явно, трогает ли рез существующий код. Если трогает — начни с read-only разведки и приведи куски кода, а не пересказ. Если не трогает — напиши это прямо, молча шаг не пропускается.'
    - 'Назови, кто физически исполняет каждый шаг и может ли: права, доступ, окружение, наличие триггера.'
    - 'Рисковые шаги (nginx, certbot, DNS, sudo, удаления) выделяй отдельно: они требуют остановки и подтверждения.'
  design:
    - 'Источник истины по UI — DESIGN.md. Новые токены, цвета, отступы и паттерны в коде не изобретаются.'
    - 'Упёрся в непокрытое дизайном — остановка и вопрос в чат, не самодеятельность.'
    - 'Порядок блоков главной задан автором: кто мы и что делаем, где работали, допуски, как связаться.'
  specs:
    - 'У каждого требования есть дом: проверяй grep по openspec/specs/, а не по названию документа.'
    - 'Смена смысла или заголовка требования — прямая правка живой спеки тем же резом, со сверкой множествами заголовков машинно, и поимённо в паспорте реза.'
    - 'Требование, привязанное к событию, покрывает сам путь наступления события, а не только следствие.'
  tasks:
    - 'Условие закрытия формулируется машинно проверяемым: команда, счёт, множество до и после. «Проверено глазами» допустимо только там, где машинной формы нет, и это называется вслух.'
    - 'Проверка обязана валить ошибку, а не печатать «ок». Заведомо неверный вход должен ронять сборку.'
    - '«Закоммичено» не равно «работает»: живое проверяется на живом, после сборки — жёсткой перезагрузкой.'
    - 'Дефект или долг, найденный по ходу работы, немедленно становится строкой tasks.'
    - 'Заглушки-«рыбы» в содержании запрещены: либо настоящий текст, либо пометка [ВРЕМЕННОЕ] со строкой в очереди ROADMAP тем же тактом.'
