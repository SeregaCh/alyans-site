nazvanie: Объекты аэронавигации
opisanie: Наземные станции аэронавигации в аэропортах России — от проектной документации до монтажа оборудования.
rabotyi:
  - Проектная документация на размещение наземных станций AGS, DVOR/DME, ILS
  - Сопровождение разрешительной документации, санитарно-эпидемиологические заключения
  - Подготовка площадок и опорных конструкций
  - Монтаж аппаратных контейнеров, антенных систем и отражателей
  - Защитные покрытия конструкций, в том числе в условиях Крайнего Севера
