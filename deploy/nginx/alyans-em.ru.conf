server {
    listen 80;
    server_name alyans-em.ru;
    root /var/www/alyans/prod/current;
    index index.html;
    error_page 404 /404.html;
    location / { try_files $uri $uri/ @notfound; }
    location @notfound { return 404; }
    location = /404.html { internal; }
}

server {
    listen 80;
    server_name www.alyans-em.ru;
    return 301 https://alyans-em.ru$request_uri;
}
